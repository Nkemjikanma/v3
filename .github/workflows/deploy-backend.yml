name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "be/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./be

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/test_db

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            be/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('be/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres || true

      - name: Run migrations
        run: sqlx migrate run

      - name: Check sqlx query cache
        run: cargo sqlx prepare --check

      - name: Run tests
        run: cargo test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./be

    steps:
      - uses: actions/checkout@v4

      - name: Install Rustfinity CLI
        run: cargo install rustfinity || true

      - name: Deploy to Rustfinity Cloud
        run: rustfinity deploy
        env:
          RUSTFINITY_API_KEY: ${{ secrets.RUSTFINITY_API_KEY }}
