[[redirects]]
  from = "/blog/*"
  to = "https://scribbledlittlenotes.netlify.app/:splat"
  status = 200
  force = true

# SPA fallback - must come after other redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  # Skip the deploy when this commit changed nothing in this site's folder (runs from the base
  # directory). Compare with HEAD^, not $CACHED_COMMIT_REF: a PR merge has the same files as the
  # preview Netlify already built, so the cached ref would cancel every production deploy.
  ignore = "git diff --quiet HEAD^ HEAD -- ."
