[[redirects]]
  from = "/blog/*"
  to = "https://scribbledlittlenotes.netlify.app/:splat"
  status = 200
  force = true

# SPA fallback - must come after other redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  # Skip the deploy when nothing under client/ changed (runs from the base directory).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."
