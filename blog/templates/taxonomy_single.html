{% extends "base.html" %}

{% block title %}#{{ term.name }} - {{ config.title }}{% endblock title %}

{% block content %}
<section>
  <div class="section-title">
    <h2>#{{ term.name }}</h2>
    <a href="{{ get_url(path='journal/') }}" class="view-all">journal</a>
  </div>
  <ul class="posts">
    {% for page in term.pages %}
    <li class="post-item">
      <a href="{{ page.permalink | safe }}">{{ page.title }}</a>
      <span class="post-date">{{ page.date | date(format="%b %d, %Y") }}</span>
    </li>
    {% endfor %}
  </ul>
</section>
{% endblock content %}
